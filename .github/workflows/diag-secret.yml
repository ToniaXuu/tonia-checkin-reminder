name: 诊断 Secret

# 临时诊断用：只输出各候选名字的「值的长度」，不输出值本身。
# 定位 BARK_KEY 为什么在主工作流里是空。
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 secrets 与 vars 各候选名字
        env:
          S_BARK_KEY: ${{ secrets.BARK_KEY }}
          S_bark_key: ${{ secrets.bark_key }}
          S_Bark_Key: ${{ secrets.Bark_Key }}
          S_BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          S_BARK_KEY_1: ${{ secrets.BARK_KEY_1 }}
          S_BARK: ${{ secrets.BARK }}
          S_BARKKEY: ${{ secrets.BARKKEY }}
          S_BARK_DEVICE: ${{ secrets.BARK_DEVICE }}
          S_BARK_SERVER: ${{ secrets.BARK_SERVER }}
          V_BARK_KEY: ${{ vars.BARK_KEY }}
          V_bark_key: ${{ vars.bark_key }}
          V_BARK_DEVICE_KEY: ${{ vars.BARK_DEVICE_KEY }}
          V_BARK: ${{ vars.BARK }}
          S_DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          echo "──────── Secrets（长度 0 = 不存在或为空）────────"
          printf "  %-24s %s\n" "secrets.BARK_KEY"          "${#S_BARK_KEY}"
          printf "  %-24s %s\n" "secrets.bark_key"          "${#S_bark_key}"
          printf "  %-24s %s\n" "secrets.Bark_Key"          "${#S_Bark_Key}"
          printf "  %-24s %s\n" "secrets.BARK_DEVICE_KEY"   "${#S_BARK_DEVICE_KEY}"
          printf "  %-24s %s\n" "secrets.BARK_KEY_1"        "${#S_BARK_KEY_1}"
          printf "  %-24s %s\n" "secrets.BARK"              "${#S_BARK}"
          printf "  %-24s %s\n" "secrets.BARKKEY"           "${#S_BARKKEY}"
          printf "  %-24s %s\n" "secrets.BARK_DEVICE"       "${#S_BARK_DEVICE}"
          printf "  %-24s %s\n" "secrets.BARK_SERVER"       "${#S_BARK_SERVER}"
          echo "──────── Variables ────────"
          printf "  %-24s %s\n" "vars.BARK_KEY"            "${#V_BARK_KEY}"
          printf "  %-24s %s\n" "vars.bark_key"            "${#V_bark_key}"
          printf "  %-24s %s\n" "vars.BARK_DEVICE_KEY"     "${#V_BARK_DEVICE_KEY}"
          printf "  %-24s %s\n" "vars.BARK"                "${#V_BARK}"
          echo "──────── 对照组（已知可用的 secret）────────"
          printf "  %-24s %s\n" "secrets.DINGTALK_WEBHOOK" "${#S_DINGTALK_WEBHOOK}"
          echo "──────── 上下文信息 ────────"
          echo "仓库: $GITHUB_REPOSITORY"
          echo "触发分支: $GITHUB_REF_NAME"
          echo "Secret 来源级别: 见 job 日志的 'Secret source' 行"
