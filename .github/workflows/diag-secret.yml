name: 诊断 Secret

# 临时诊断用：只输出各候选名字的「值的长度」，不输出值本身。
# 定位 BARK_KEY 为什么在主工作流里是空。
# 注意：Actions 的 env 键名不区分大小写，所以这里用编号区分，不能靠大小写。
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 secrets 与 vars 各候选名字
        env:
          S01: ${{ secrets.BARK_KEY }}
          S02: ${{ secrets.bark_key }}
          S03: ${{ secrets.Bark_Key }}
          S04: ${{ secrets.BARK_DEVICE_KEY }}
          S05: ${{ secrets.BARK }}
          S06: ${{ secrets.BARKKEY }}
          S07: ${{ secrets.BARK_SERVER }}
          S08: ${{ secrets.BARK_KEY_ }}
          S09: ${{ secrets.BARKKEY_DEVICE }}
          V01: ${{ vars.BARK_KEY }}
          V02: ${{ vars.bark_key }}
          V03: ${{ vars.BARK_DEVICE_KEY }}
          V04: ${{ vars.BARK }}
          CTRL: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          echo "──────── Secrets（长度 0 = 不存在或为空）────────"
          printf "  %-26s %s\n" "secrets.BARK_KEY"          "${#S01}"
          printf "  %-26s %s\n" "secrets.bark_key"          "${#S02}"
          printf "  %-26s %s\n" "secrets.Bark_Key"          "${#S03}"
          printf "  %-26s %s\n" "secrets.BARK_DEVICE_KEY"   "${#S04}"
          printf "  %-26s %s\n" "secrets.BARK"              "${#S05}"
          printf "  %-26s %s\n" "secrets.BARKKEY"           "${#S06}"
          printf "  %-26s %s\n" "secrets.BARK_SERVER"       "${#S07}"
          printf "  %-26s %s\n" "secrets.BARK_KEY_ (尾下划线)" "${#S08}"
          printf "  %-26s %s\n" "secrets.BARKKEY_DEVICE"    "${#S09}"
          echo "──────── Variables ────────"
          printf "  %-26s %s\n" "vars.BARK_KEY"            "${#V01}"
          printf "  %-26s %s\n" "vars.bark_key"            "${#V02}"
          printf "  %-26s %s\n" "vars.BARK_DEVICE_KEY"     "${#V03}"
          printf "  %-26s %s\n" "vars.BARK"                "${#V04}"
          echo "──────── 对照组（已知可用）────────"
          printf "  %-26s %s\n" "secrets.DINGTALK_WEBHOOK" "${#CTRL}"
          echo "──────── 上下文 ────────"
          echo "仓库: $GITHUB_REPOSITORY"
          echo "分支: $GITHUB_REF_NAME"
