name: 打卡提醒

# 轮询模式：定时器只负责「每隔几分钟叫醒脚本一次」，
# 真正决定发不发的是脚本对 config.json 里时间窗口的判断。
# 所以网页（settings.html）改完时间即刻生效，无需改动定时器。

on:
  schedule:
    # 兜底轮询。cron-job.org 配好后这段可删（GitHub cron 延迟不可控）
    - cron: "*/10 * * * *"

  workflow_dispatch:
    inputs:
      id:
        description: "提醒 ID（留空 = 按时间窗口自动判断；如 dt-1705）"
        required: false
        default: ""
        type: string
      force:
        description: "强制发送（忽略工作日判断与当日去重）"
        required: false
        default: false
        type: boolean

# 串行化，避免兜底轮询与 cron-job.org 同时触发导致重复推送
concurrency:
  group: checkin-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 同步最新数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          echo "───── 当前 config.json ─────"
          cat config.json

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 发送打卡提醒
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          REMINDER_ID: ${{ inputs.id }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ -n "$REMINDER_ID" ]; then ARGS="--id $REMINDER_ID"; fi
          if [ "$FORCE_INPUT" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "运行参数: $ARGS"
          python scripts/send_reminder.py $ARGS

      - name: 提交提醒日志与节假日缓存
        run: |
          if [[ -n $(git status --porcelain data/) ]]; then
            git add -A data/
            git commit -m "log: 记录打卡提醒推送 [skip ci]"
            git push
            echo "✅ 数据已提交"
          else
            echo "⏭️ 数据无变化"
          fi
