name: 打卡提醒

# 轮询模式：定时器只负责「每隔几分钟叫醒脚本一次」，
# 真正决定发不发的是脚本对 config.json 里时间窗口的判断。
# 所以网页（settings.html）改完时间即刻生效，无需改动定时器。

on:
  schedule:
    # 兜底轮询。cron-job.org 配好后这段可删（GitHub cron 延迟不可控）
    - cron: "*/10 * * * *"

  workflow_dispatch:
    inputs:
      id:
        description: "提醒 ID（留空 = 按时间窗口自动判断；如 dt-1705）"
        required: false
        default: ""
        type: string
      force:
        description: "强制发送（忽略工作日判断与当日去重）"
        required: false
        default: false
        type: boolean

# 串行化，避免兜底轮询与 cron-job.org 同时触发导致重复推送
concurrency:
  group: checkin-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 同步最新数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          echo "───── 当前 config.json ─────"
          cat config.json

      - name: 拉取推送记录（当日去重依据）
        run: |
          # 日志平时只存在 data 分支，main 上是空的。
          # 不先取回来，append_log 会从零开始，去重失效、同一条当天可能重复推送。
          mkdir -p data
          if git fetch origin data:refs/remotes/origin/data --depth=1 2>/dev/null; then
            if git show origin/data:data/reminder_log.json > data/reminder_log.json 2>/dev/null; then
              echo "✅ 已从 data 分支恢复 $(python3 -c "import json;print(len(json.load(open('data/reminder_log.json'))['history']))" 2>/dev/null || echo '?') 条历史记录"
            else
              echo "⚠️ data 分支存在但没有日志文件，按空日志处理"
            fi
          else
            echo "⏭️ 还没有 data 分支（首次运行），按空日志处理"
          fi

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 发送打卡提醒
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          REMINDER_ID: ${{ inputs.id }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ -n "$REMINDER_ID" ]; then ARGS="--id $REMINDER_ID"; fi
          if [ "$FORCE_INPUT" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "运行参数: $ARGS"
          python scripts/send_reminder.py $ARGS

      - name: 节假日缓存有更新则提交到 main
        run: |
          # 节假日是「参考数据」，一年变一两次，且下次运行要复用，所以留在 main
          if [[ -n $(git status --porcelain data/holiday_*.json 2>/dev/null) ]]; then
            git add data/holiday_*.json
            git commit -m "data: 更新节假日缓存 [skip ci]"
            git push
            echo "✅ 节假日缓存已提交"
          else
            echo "⏭️ 节假日缓存无变化"
          fi

      - name: 推送记录推到 data 分支（保持 main 干净）
        run: |
          set -e
          # 运行日志天天变，放 main 会把提交历史淹掉（30 天 169 个 log 提交）
          if [[ -z $(git status --porcelain data/reminder_log.json 2>/dev/null) ]]; then
            echo "⏭️ 推送记录无变化"
            exit 0
          fi

          tmp=$(mktemp -d)
          cp data/reminder_log.json "$tmp"/

          # data 分支只存「最新快照」：孤儿提交 + 强推，永远只有一个提交
          git checkout --orphan data-snapshot
          git rm -rf . --quiet || true
          mkdir -p data
          cp "$tmp/reminder_log.json" data/
          git add -A

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "log: 记录打卡提醒推送 [skip ci]"
          git push --force origin HEAD:data
          echo "✅ 已更新 data 分支（看板会自动读取）"
